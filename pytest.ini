[pytest]
# PyTest Configuration for MCP-OUTLOOK Unit Tests

# Test paths
testpaths = src/unit_test

# Python files patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Disable parallel execution to prevent OOM (out of memory) issues
# This ensures tests run sequentially, reducing memory pressure
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    # Force sequential execution (no parallel with pytest-xdist)
    -p no:xdist

# Markers for selective test execution
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (require real Outlook)
    unit: marks tests as unit tests (use mocks, no real Outlook)

# Logging
log_cli = false
log_cli_level = INFO

# Coverage options (when using --cov)
[coverage:run]
source = src/tools
omit = 
    */tests/*
    */test_*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False


